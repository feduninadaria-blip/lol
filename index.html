factImage: "images/циолковский.jpg",
questionImage: "images/буба.jpg"
}

]

};


/* =========================================================
   ПЕРЕМЕННЫЕ
   ========================================================= */

let currentTopic = "";
let questions = [];
let currentQuestion = 0;


/* =========================================================
   ЭЛЕМЕНТЫ СТРАНИЦЫ
   ========================================================= */

const menu = document.getElementById("menu");
const quiz = document.getElementById("quiz");

const topicsContainer = document.getElementById("topics");

const question = document.getElementById("question");
const questionImage = document.getElementById("questionImage");

const answersContainer = document.getElementById("answers");

const result = document.getElementById("result");

const fact = document.getElementById("fact");
const factImage = document.getElementById("factImage");

const nextButton = document.getElementById("nextButton");


/* =========================================================
   СОЗДАЁМ КНОПКИ ТЕМ
   ========================================================= */

Object.keys(questionsByTopic).forEach(topic => {

    const button = document.createElement("button");

    button.className = "topic-button";

    button.textContent = topic;

    button.onclick = function() {
        openQuiz(topic);
    };

    topicsContainer.appendChild(button);

});


/* =========================================================
   ОТКРЫТЬ ВИКТОРИНУ
   ========================================================= */

function openQuiz(topic) {

    currentTopic = topic;

    questions = questionsByTopic[topic] || [];

    currentQuestion = 0;

    menu.style.display = "none";

    quiz.style.display = "block";

    showQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   ПОКАЗАТЬ ВОПРОС
   ========================================================= */

function showQuestion() {

    /*
       Если вопросы закончились
    */

    if (currentQuestion >= questions.length) {

        showFinish();

        return;
    }


    const current = questions[currentQuestion];


    /* =========================
       СБРАСЫВАЕМ СТАРЫЙ ФАКТ
       ========================= */

    fact.textContent = "";

    factImage.src = "";

    factImage.style.display = "none";


    /* =========================
       СБРАСЫВАЕМ РЕЗУЛЬТАТ
       ========================= */

    result.textContent = "";

    result.style.color = "";


    /* =========================
       ПОКАЗЫВАЕМ ВОПРОС
       ========================= */

    question.textContent = current.question;


    /* =========================
       ПОКАЗЫВАЕМ КАРТИНКУ ВОПРОСА
       ========================= */

    if (current.questionImage) {

        questionImage.src = current.questionImage;

        questionImage.style.display = "block";

    } else {

        questionImage.src = "";

        questionImage.style.display = "none";
    }


    /* =========================
       ОЧИЩАЕМ СТАРЫЕ ОТВЕТЫ
       ========================= */

    answersContainer.innerHTML = "";


    /* =========================
       СОЗДАЁМ ОТВЕТЫ
       ========================= */

    current.answers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "answer-button";

        button.textContent = answer;

        button.onclick = function() {

            checkAnswer(answer);

        };

        answersContainer.appendChild(button);

    });


    /* =========================
       ПРЯЧЕМ СЛЕДУЮЩИЙ
       ========================= */

    nextButton.style.display = "none";
}


/* =========================================================
   ПРОВЕРКА ОТВЕТА
   ========================================================= */

function checkAnswer(answer) {

    const current = questions[currentQuestion];


    /* =========================
       ПРОВЕРЯЕМ ОТВЕТ
       ========================= */

    if (answer === current.correct) {

        result.textContent = "Правильно! 🎉";

        result.style.color = "#2E7D32";

    } else {

        result.textContent = "Неправильно! 😿";

        result.style.color = "#C62828";
    }


    /* =====================================================
       ВАЖНО:

       КАРТИНКА ВОПРОСА ПОЛНОСТЬЮ ИСЧЕЗАЕТ
       ===================================================== */

    questionImage.src = "";

    questionImage.style.display = "none";


    /* =====================================================
       ВАРИАНТЫ ОТВЕТА ПОЛНОСТЬЮ ИСЧЕЗАЮТ
       ===================================================== */

    answersContainer.innerHTML = "";


    /* =========================
       ПОКАЗЫВАЕМ ФАКТ
       ========================= */

    fact.textContent = current.fact || "";


    /* =========================
       ПОКАЗЫВАЕМ КАРТИНКУ ФАКТА
       ========================= */

    if (current.factImage) {

        factImage.src = current.factImage;

        factImage.style.display = "block";

    } else {

        factImage.src = "";

        factImage.style.display = "none";
    }


    /* =========================
       ПОКАЗЫВАЕМ СЛЕДУЮЩИЙ
       ========================= */

    nextButton.style.display = "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   СЛЕДУЮЩИЙ ВОПРОС
   ========================================================= */

function nextQuestion() {

    currentQuestion++;

    showQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   КОНЕЦ ВИКТОРИНЫ
   ========================================================= */

function showFinish() {

    question.textContent = "";

    questionImage.src = "";

    questionImage.style.display = "none";

    answersContainer.innerHTML = "";

    result.textContent = "";

    fact.textContent = "";

    factImage.src = "";

    factImage.style.display = "none";

    nextButton.style.display = "none";


    question.innerHTML = `
        <div class="finish-title">
            🎉 Викторина закончена!
        </div>

        <div class="finish-text">
            Ты ответил(а) на все вопросы!
        </div>
    `;
}


/* =========================================================
   ВЕРНУТЬСЯ К ТЕМАМ
   ========================================================= */

function backToMenu() {

    currentTopic = "";

    questions = [];

    currentQuestion = 0;


    quiz.style.display = "none";

    menu.style.display = "block";


    question.textContent = "";

    questionImage.src = "";

    questionImage.style.display = "none";

    answersContainer.innerHTML = "";

    result.textContent = "";

    fact.textContent = "";

    factImage.src = "";

    factImage.style.display = "none";

    nextButton.style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
